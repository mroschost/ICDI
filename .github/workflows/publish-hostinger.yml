name: Publish ICDI Hostinger build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'index.php'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: icdi-hostinger-production
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
          fetch-depth: 1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and resolve build dependencies
        # The master branch currently has no package-lock.json. npm install
        # creates a consistent lockfile before the existing build validator runs.
        run: npm install --no-audit --no-fund

      - name: Build vinext application
        run: |
          chmod +x scripts/*.sh
          npm run build

      - name: Export static Hostinger frontend
        run: node scripts/export-hostinger.mjs

      - name: Verify build entry points and updated mobile components
        run: |
          test -s index.php
          test -s projetos/index.php
          test -s transparencia/index.php
          test -s admin/index.php
          test -d assets
          grep -q '/assets/' index.php
          grep -ql 'Explore o ICDI' assets/App-*.js
          grep -ql 'Menu de navegação' assets/App-*.js
          grep -q 'top-0 hidden h-20 bg-gradient-to-b' src/components/home/HeroSection.tsx

      - name: Commit generated site to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.php projetos/index.php transparencia/index.php admin/index.php assets
          if git diff --cached --quiet; then
            echo "No published asset changes"
            exit 0
          fi
          git commit -m "build(hostinger): publish compiled site [skip ci]"
          git push origin HEAD:master

      - name: Check live Hostinger publication
        run: |
          expected_css="$(grep -oE '/assets/index-[A-Za-z0-9_-]+[.]css' index.php | head -n 1)"
          if [[ -z "$expected_css" ]]; then
            echo "Cannot identify expected CSS bundle" >&2
            exit 1
          fi

          echo "Waiting for https://icdiinstituto.com.br/ to serve $expected_css"
          for attempt in $(seq 1 30); do
            actual="$(curl -fsSL --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' "https://icdiinstituto.com.br/?icdi-build=$GITHUB_SHA" 2>/dev/null || true)"
            if [[ "$actual" == *"$expected_css"* ]]; then
              echo "Verified live production HTML references the latest CSS bundle: $expected_css"

              # Resolve the exact live React bundle from the entry HTML instead of
              # trusting the local compiled asset alone.
              client_file="$(grep -oE '/assets/icdi-client-[A-Za-z0-9_-]+[.]js' index.php | head -n 1)"
              test -n "$client_file"
              app_file="$(grep -oE 'App-[A-Za-z0-9_-]+[.]js' ".${client_file}" | head -n 1)"
              test -n "$app_file"
              live_app="$(curl -fsSL --retry 3 --max-time 45 -H 'Cache-Control: no-cache' "https://icdiinstituto.com.br/assets/$app_file")"
              if [[ "$live_app" != *"Explore o ICDI"* ]] || [[ "$live_app" != *"Menu de navegação"* ]]; then
                echo "::error::Live JavaScript bundle is missing the mobile menu update: $app_file"
                exit 1
              fi
              echo "Verified live JavaScript includes the updated mobile menu: $app_file"
              exit 0
            fi
            echo "Live site not updated yet (attempt $attempt/30)"
            sleep 10
          done
          echo "::error::Hostinger did not serve the new compiled HTML within the verification window"
          exit 1
